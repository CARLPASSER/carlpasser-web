<style>
/* Layout: modern 70 / retro 30. Light cream page with lots of air; the CAR MATCH italic logo,
   the little road and the collectible card carry the play. Royal blue is the only accent;
   each type gets one harmonised colour that lives inside its card. Single light theme by choice. */
:root {
  color-scheme: light;
  --bg: #f4f2ed;
  --paper: #fdfcf9;
  --white: #ffffff;
  --ink: #1d1d1f;
  --ink-2: #3c3b39;
  --muted: #78756e;
  --line: #e3dfd6;
  --blue: #2451b5;
  --blue-deep: #18357d;
  --sky: #e4ebf8;
  --sun: #ffc94a;
  --skin: #ffd7b5;
  --logo: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --latin: "Outfit", "Helvetica Neue", Arial, sans-serif;
  --jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--jp); font-size: 16px; line-height: 1.8; }
p, h1, h2, h3 { margin: 0; }
p { text-wrap: pretty; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.lat { font-family: var(--latin); }
.wrap {
  max-width: 600px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 20px 72px;
  display: flex; flex-direction: column; gap: 32px;
}
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 30px; }
.brand { height: 26px; width: auto; display: block; align-self: flex-start; flex: none; }
.brand.lg { height: 34px; }

/* ---------- CAR MATCH logo ---------- */
.logo { font-family: var(--logo); font-style: italic; font-weight: 900; font-stretch: 112%;
  font-size: clamp(54px, 16vw, 88px); line-height: .88; letter-spacing: -.03em; }
.logo span { color: var(--blue); }
.logo.sm { font-size: 17px; line-height: 1; letter-spacing: -.01em; }
.stripes { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; }
.stripes i { display: block; height: 3px; border-radius: 2px; background: var(--blue); transform: skewX(-24deg); }
.stripes i:nth-child(1) { width: 56%; } .stripes i:nth-child(2) { width: 42%; opacity: .7; } .stripes i:nth-child(3) { width: 28%; opacity: .4; }

/* ---------- start ---------- */
.hero { display: flex; flex-direction: column; gap: 22px; }
.title { font-weight: 800; font-size: clamp(26px, 7vw, 36px); line-height: 1.45; letter-spacing: -.005em; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; }
.title em { font-style: normal; color: var(--blue); }
.sub { font-size: 16px; color: var(--ink-2); word-break: keep-all; overflow-wrap: anywhere; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--white); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 13px; font-weight: 500; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 14px;
  background: var(--blue); color: var(--white); border: 0; border-radius: 999px; text-decoration: none;
  padding: 18px 30px; font-weight: 700; font-size: 17px; box-shadow: 0 10px 24px -10px rgba(36,81,181,.7);
  transition: transform .15s, box-shadow .15s, background .15s;
}
.btn:hover { transform: translateY(-2px); background: var(--blue-deep); }
.btn:active { transform: translateY(1px); }
.btn .arr { font-family: var(--logo); font-style: italic; font-weight: 900; letter-spacing: .02em; }
.btn.wide { width: 100%; }
.btn.big { padding: 22px 30px; font-size: 20px; }
.btn.line { background: var(--white); color: var(--ink); border: 1.5px solid var(--ink); box-shadow: none; }
.btn.line:hover { background: var(--sky); }
.teaser { display: flex; flex-direction: column; gap: 14px; }
.teaser h2 { font-size: 15px; font-weight: 700; }
.fan { position: relative; height: 0; padding-bottom: 60%; }
@media (min-width: 560px) { .fan { padding-bottom: 0; height: 260px; } }
.fan .mini { position: absolute; top: 10px; width: 40%; max-width: 190px; box-shadow: 0 12px 26px -12px rgba(29,29,31,.35); }
.fan .mini:nth-child(1) { left: 6%; transform: rotate(-8deg); }
.fan .mini:nth-child(2) { left: 30%; top: 0; z-index: 2; transform: rotate(1deg); }
.fan .mini:nth-child(3) { left: 54%; transform: rotate(9deg); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.foot p { font-size: 12px; color: var(--muted); max-width: 30em; }
.motto { font-family: var(--latin); font-weight: 700; font-size: 11px; letter-spacing: .18em; }

/* ---------- road + pop car ---------- */
.stage { position: relative; height: 122px; }
.road { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; border-radius: 13px; background: var(--ink); overflow: hidden; }
.road::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 3px;
  background: repeating-linear-gradient(90deg, var(--paper) 0 18px, transparent 18px 36px); animation: dash .45s linear infinite; }
.road .flag { position: absolute; right: 0; top: 0; bottom: 0; width: 16px;
  background: repeating-conic-gradient(var(--paper) 0 25%, var(--ink) 0 50%) 0 0 / 8px 8px; }
.pole { position: absolute; right: 8px; bottom: 26px; width: 2.5px; height: 64px; background: var(--ink); border-radius: 2px; }
.pole::after { content: ""; position: absolute; right: 2.5px; top: 0; width: 30px; height: 20px; border-radius: 2px;
  background: repeating-conic-gradient(var(--ink) 0 25%, var(--paper) 0 50%) 0 0 / 10px 10px;
  transform-origin: right center; animation: wave 1s ease-in-out infinite alternate; }
@keyframes wave { from { transform: skewY(-6deg); } to { transform: skewY(6deg); } }
@keyframes dash { to { background-position: -36px 0; } }
.rider { position: absolute; bottom: 10px; left: 0; width: 140px; transition: left .7s cubic-bezier(.3,.7,.25,1); }
.rider svg { display: block; width: 100%; height: auto; overflow: visible; }
.wheel { transform-box: fill-box; transform-origin: center; animation: spin .45s linear infinite; }
.bob { animation: bob .32s ease-in-out infinite alternate; }
.speed line { animation: whoosh .6s linear infinite; }
.speed line:nth-child(2) { animation-delay: .2s; } .speed line:nth-child(3) { animation-delay: .4s; }
.note { animation: float 1.6s ease-in-out infinite; } .note.n2 { animation-delay: .8s; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { to { transform: translateY(-2px); } }
@keyframes whoosh { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-18px); opacity: 0; } }
@keyframes float { 0% { transform: translateY(4px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-14px); opacity: 0; } }
.goal { position: absolute; left: 50%; top: 0; transform: translateX(-50%) rotate(-5deg) scale(.4); opacity: 0;
  font-family: var(--logo); font-style: italic; font-weight: 900; font-stretch: 115%; font-size: 44px; color: var(--blue); letter-spacing: -.02em; pointer-events: none; }
.stage.done .goal { animation: stamp .45s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes stamp { to { opacity: 1; transform: translateX(-50%) rotate(-5deg) scale(1); } }

/* ---------- GOAL overlay ---------- */
.goal-ov { position: fixed; inset: 0; z-index: 25; background: rgba(244,242,237,.95); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
.goal-ov .checker { width: min(64%, 240px); height: 20px; border-radius: 4px;
  background: repeating-conic-gradient(var(--ink) 0 25%, var(--white) 0 50%) 0 0 / 20px 20px; animation: sweep .45s ease-out both; }
.goal-ov .goal-big { font-family: var(--logo); font-style: italic; font-weight: 900; font-stretch: 115%; letter-spacing: -.03em;
  font-size: clamp(64px, 21vw, 140px); line-height: .9; color: var(--blue); padding-right: .08em; animation: zoomin .6s cubic-bezier(.2,1.6,.4,1) .05s both; }
.goal-ov .goal-next { font-weight: 700; font-size: 18px; opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s; }
.goal-ov.next .goal-next { opacity: 1; transform: none; }
.goal-ov .skip { position: absolute; right: max(20px, env(safe-area-inset-right, 0px)); bottom: max(24px, calc(env(safe-area-inset-bottom, 0px) + 12px)); }
@keyframes zoomin { 0% { transform: scale(.2); opacity: 0; } 65% { transform: scale(1.1); opacity: 1; } 82% { transform: scale(.96); } 100% { transform: scale(1); } }
@keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ---------- quiz ---------- */
.qcount { font-family: var(--latin); font-weight: 600; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qcount b { font-family: var(--logo); font-style: italic; font-weight: 900; font-size: 26px; color: var(--blue); margin-right: 2px; }
.segs { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.segs i { height: 5px; border-radius: 3px; background: var(--line); transition: background .3s; }
.segs i.on { background: var(--blue); }
.qhead { display: flex; flex-direction: column; gap: 12px; }
.cat { align-self: flex-start; font-size: 12px; font-weight: 700; color: var(--blue); background: var(--sky); border-radius: 999px; padding: 3px 12px; }
.cat .lat { letter-spacing: .14em; margin-right: 6px; font-weight: 700; }
.checkpoint { display: flex; align-items: center; gap: 12px; background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
  animation: pop .5s cubic-bezier(.2,1.5,.4,1) both; }
.checkpoint .f { flex: none; width: 34px; height: 24px; border-radius: 3px; background: repeating-conic-gradient(var(--ink) 0 25%, var(--white) 0 50%) 0 0 / 12px 12px; }
.checkpoint b { font-family: var(--latin); font-size: 11px; letter-spacing: .18em; color: var(--blue); display: block; line-height: 1.4; }
.checkpoint span { font-size: 14px; font-weight: 700; word-break: keep-all; overflow-wrap: anywhere; }
@keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.96); } to { opacity: 1; transform: none; } }
.qtext { font-weight: 700; font-size: clamp(22px, 5.8vw, 28px); line-height: 1.55; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 540px) { .opts { grid-template-columns: 1fr; } }
.opt { text-align: left; background: var(--white); border: 1.5px solid var(--line); border-radius: 16px;
  padding: 14px 16px; display: flex; gap: 14px; align-items: center; min-width: 0;
  box-shadow: 0 1px 2px rgba(29,29,31,.04); transition: border-color .15s, transform .15s, background .15s; }
.opt:hover { border-color: var(--blue); transform: translateY(-1px); }
.opt .k { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--sky); color: var(--blue); font-family: var(--latin); font-weight: 700; font-size: 14px; }
.opt .t { font-weight: 700; font-size: 15.5px; line-height: 1.5; min-width: 0; }
.opt .s { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; }
.opt.picked { background: var(--blue); border-color: var(--blue); color: var(--white); animation: tap .32s ease-out; }
@keyframes tap { 0% { transform: scale(.97); } 60% { transform: scale(1.015); } 100% { transform: scale(1); } }
.opt.picked .k { font-size: 0; }
.opt.picked .k::after { content: ""; width: 10px; height: 6px; border: solid var(--blue); border-width: 0 0 2.5px 2.5px; transform: translateY(-1px) rotate(-45deg); }
.rider.hop svg { animation: hop .35s ease-out; }
@keyframes hop { 40% { transform: translateY(-6px); } 100% { transform: none; } }
.opt.picked .k { background: var(--white); }
.opt.picked .s { color: var(--sky); }
.nav { display: flex; justify-content: space-between; }
.link { background: none; border: 0; padding: 6px 0; color: var(--muted); font-size: 14px; }
.link:hover { color: var(--blue); }
.link[disabled] { visibility: hidden; }

/* ---------- collection card ---------- */
.flipbox { width: min(100%, 380px); align-self: center; perspective: 1200px; }
.tilt { transition: transform .25s ease-out; transform-style: preserve-3d; }
.flip { display: grid; transform-style: preserve-3d; animation: flipin 1s cubic-bezier(.3,1.25,.45,1) .2s both; }
@keyframes flipin { from { transform: rotateY(180deg) scale(.92); } to { transform: rotateY(0) scale(1); } }
.flip > * { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.card { position: relative; background: var(--white); border: 1.5px solid var(--ink); border-radius: 20px; overflow: hidden;
  box-shadow: 0 24px 48px -20px rgba(29,29,31,.35); display: flex; flex-direction: column; }
.card::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.8) 46%, rgba(255,214,120,.45) 52%, transparent 66%) var(--sx, 120%) 0 / 260% 100% no-repeat;
  animation: shine 1.4s ease-out 1s both; }
.tilt.live .card::after { animation: none; }
@keyframes shine { from { background-position: 120% 0; } to { background-position: -40% 0; } }
.back { transform: rotateY(180deg); background: var(--blue); color: var(--white); border-radius: 20px; position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.back::before { content: ""; position: absolute; inset: 12px; border: 1.5px solid rgba(255,255,255,.35); border-radius: 12px; }
.back .logo { font-size: 54px; text-align: center; }
.back .logo span { color: var(--sun); }
.card-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1.5px solid var(--ink); }
.card-head .no { font-family: var(--latin); font-weight: 700; font-size: 12px; letter-spacing: .12em; }
.art { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--tc); overflow: hidden; border-bottom: 1.5px solid var(--ink); }
.art .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.art .bignum { position: absolute; right: 12px; top: -4px; font-family: var(--logo); font-style: italic; font-weight: 900; font-stretch: 100%;
  font-size: 112px; line-height: 1; color: transparent; -webkit-text-stroke: 1.5px var(--white); opacity: .6; }
.art .typetag { position: absolute; left: 14px; top: 14px; font-family: var(--latin); font-weight: 700; font-size: 11px; letter-spacing: .14em;
  color: var(--ink); background: var(--white); border-radius: 999px; padding: 3px 10px; }
.art .lane { position: absolute; left: 0; right: 0; bottom: 0; height: 17%; background: var(--ink); }
.art .lane::before { content: ""; position: absolute; left: 0; right: 0; top: 45%; height: 3px;
  background: repeating-linear-gradient(90deg, var(--paper) 0 16px, transparent 16px 32px); animation: dash .45s linear infinite; }
.art .car { position: absolute; left: 50%; bottom: 8%; width: 66%; transform: translateX(-46%); }
.art .car svg { display: block; width: 100%; height: auto; overflow: visible; }
.card-body { padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 6px; }
.card-body .en { font-family: var(--latin); font-weight: 700; font-size: 12px; letter-spacing: .16em; color: var(--tcd); }
.card-body h1 { font-weight: 800; font-size: clamp(25px, 7vw, 30px); line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
.card-body .punch { font-weight: 500; font-size: 15px; color: var(--ink-2); word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; padding: 4px 18px 14px; }
.stat { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; }
.pips { display: flex; gap: 3px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.pips i.on { background: var(--tc); }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px 14px; border-top: 1px dashed var(--line); }
.card-foot .left { display: flex; flex-direction: column; gap: 6px; }
.card-foot .brand { height: 18px; }
.plate { display: grid; justify-items: center; background: #fbfbf7; color: #1d6b43; border: 1.5px solid #1d6b43;
  border-radius: 5px; padding: 1px 10px 0; line-height: 1; box-shadow: inset 0 0 0 1.5px #fbfbf7, inset 0 0 0 2.5px #1d6b43; }
.plate .p1 { font-size: 8px; font-weight: 700; letter-spacing: .1em; padding-top: 3px; }
.plate .p2 { display: flex; align-items: center; gap: 4px; }
.plate .p2 span { font-size: 9px; font-weight: 700; }
.plate .p2 b { font-family: var(--latin); font-weight: 600; font-size: 20px; }

/* ---------- result ---------- */
.share { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.share .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(100%, 380px); }
.share > .btn { width: min(100%, 380px); }
.share-q { font-weight: 800; font-size: 18px; margin-top: 6px; }
.share .small { margin-top: -6px; margin-bottom: 4px; }
.share .btn { padding: 14px 18px; font-size: 15px; }
.small { font-size: 13px; color: var(--muted); }
.toast { color: var(--blue); font-weight: 700; font-size: 13px; min-height: 1.4em; text-align: center; white-space: pre-line; }
.block { display: flex; flex-direction: column; gap: 14px; }
.block > h2 { display: flex; flex-direction: column; gap: 2px; font-size: 20px; font-weight: 800; }
.block > h2 .lat { font-size: 11px; letter-spacing: .2em; color: var(--blue); font-weight: 700; }
.reasons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.reasons li { display: flex; gap: 12px; align-items: baseline; background: var(--white); border-radius: 12px; padding: 10px 14px; }
.reasons li .q { flex: none; font-family: var(--latin); font-weight: 700; font-size: 12px; color: var(--blue); }
.dir { background: var(--white); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.dir .body { font-weight: 800; font-size: 19px; }
.balance .ends { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; }
.balance .ends b { font-family: var(--latin); font-size: 22px; margin-left: 4px; }
.bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--sun); margin-top: 4px; }
.bar .like { background: var(--blue); }
.picks { display: flex; flex-direction: column; gap: 10px; }
.pick { background: var(--white); border: 1.5px solid transparent; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pick.rec { border-color: var(--blue); }
.pick .lbl { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.pick .lbl .n { font-family: var(--latin); font-weight: 700; color: var(--blue); }
.pick .badge { white-space: nowrap; margin-left: auto; font-size: 11px; font-weight: 700; color: var(--white); background: var(--blue); border-radius: 999px; padding: 1px 10px; }
.pick .car-name { font-weight: 800; font-size: 18px; line-height: 1.45; }
.pick .car-name small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.pick .why { font-size: 14px; color: var(--ink-2); }
.surprise { background: var(--ink); color: var(--paper); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.surprise .lat { color: var(--sun); font-weight: 700; font-size: 11px; letter-spacing: .2em; }
.surprise .car-name { font-weight: 800; font-size: 18px; }
.surprise p { font-size: 14px; }
.caution { background: var(--sky); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; }
.deck { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 560px) { .deck { grid-template-columns: repeat(2, 1fr); } }
/* 新カード（コレクション用・結果カード共通）。サイズは cqw でカード幅に合わせて伸び縮み */
.nc { position: relative; container-type: inline-size; background: var(--white); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-width: 0;
  box-shadow: 0 1px 0 rgba(29,29,31,.06), 0 14px 30px -20px rgba(29,29,31,.45); }
.nc .na { position: relative; aspect-ratio: 1 / 1; background: var(--main); overflow: hidden; }
.nc .na > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.nc .num { position: absolute; left: 5.3cqw; top: 3.3cqw; font-family: var(--logo); font-style: italic; font-weight: 900; font-stretch: 100%;
  font-size: 60px; font-size: 37cqw; line-height: .9; letter-spacing: -.05em; color: var(--num); }
.nc .wm { position: absolute; right: 5.3cqw; top: 5.3cqw; font-family: var(--logo); font-style: italic; font-weight: 900; font-size: 8px; font-size: max(7px, 3.7cqw); color: var(--num); opacity: .9; }
.nc .nm { padding: 9px 11px 11px; padding: 4cqw 5.3cqw 5cqw; display: flex; flex-direction: column; gap: 2px; }
.nc .nm .t { display: flex; justify-content: space-between; gap: 6px; font-family: var(--latin); font-weight: 700; font-size: 10px; font-size: clamp(9px, 3.7cqw, 11px); letter-spacing: .14em; color: var(--deep); }
.nc .nm .t span:last-child { color: var(--muted); letter-spacing: .08em; }
.nc .nm b { font-size: 13px; font-size: clamp(12px, 6.3cqw, 19px); font-weight: 800; line-height: 1.4; word-break: keep-all; overflow-wrap: anywhere; }
.mini.hidden .nm b { letter-spacing: .3em; color: var(--muted); }
.mini.you { outline: 3px solid var(--blue); outline-offset: 2px; }
.mini.you .wm { display: none; }
.mini.you::after { content: "YOU"; position: absolute; top: 6px; right: 6px; font-family: var(--latin); font-weight: 800; font-size: 10px; letter-spacing: .1em;
  background: var(--blue); color: var(--white); border-radius: 999px; padding: 0 7px; }
.card.nf { border: 0; border-radius: 24px; box-shadow: 0 1px 0 rgba(29,29,31,.06), 0 24px 44px -20px rgba(29,29,31,.45); }
.nf .nc { border-radius: 0; box-shadow: none; }
.nf .bd { padding: 16px 18px 10px; display: flex; flex-direction: column; gap: 4px; }
.nf .bd .en { font-family: var(--latin); font-weight: 700; font-size: 11px; letter-spacing: .16em; color: var(--deep); }
.nf .bd h1 { font-weight: 800; font-size: clamp(24px, 7vw, 29px); line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
.nf .bd .punch { font-weight: 500; font-size: 15px; color: var(--ink-2); word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance; }
.nf .stats { padding: 6px 18px 14px; }
.nf .pips i.on { background: var(--deep); }
.nf .ft { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 18px 14px; border-top: 1px solid var(--line); }
.nf .ft .brand { height: 16px; }
.nf .ft .motto { font-family: var(--latin); font-weight: 700; font-size: 10px; letter-spacing: .16em; color: var(--muted); }
.next { background: var(--white); border-radius: 20px; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; }
.next h2 { font-size: 20px; font-weight: 800; line-height: 1.5; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; }
.next p { font-size: 15px; color: var(--ink-2); }
.next .btns { display: flex; flex-direction: column; gap: 10px; }

/* ---------- save modal ---------- */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(20,20,22,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
.modal img { max-height: 64vh; max-width: 100%; border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.4); background: var(--bg); }
.modal p { color: var(--white); font-size: 13px; line-height: 1.7; text-align: center; max-width: 30em; word-break: keep-all; overflow-wrap: anywhere; }
.modal .btn { padding: 12px 26px; font-size: 15px; }

.fade { animation: fade .4s ease both; }
@keyframes fade { from { opacity: .001; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .fade, .wheel, .bob, .speed line, .note, .road::before, .art .lane::before, .pole::after, .flip, .card::after, .checkpoint, .opt.picked, .rider.hop svg, .goal-ov .checker, .goal-ov .goal-big { animation: none; }
  .goal-ov .goal-next { transition: none; }
  .rider, .tilt { transition: none; }
  .stage.done .goal { animation: none; opacity: 1; transform: translateX(-50%) rotate(-5deg); }
}
</style>
</head>

/* =========================================================
   判定
   1) タイプ  : 8タイプの合計点が最も高いもの。同点は「好きな時間」→「休日」で選んだタイプを優先、それでも同点ならORDER順。
   2) 暮らし  : 子ども・仲間 → FAMILY / 大荷物・道具運び → GEAR / 送迎・日常の買い物 → CITY / それ以外 → FREE
   3) 好き:暮らし : 最後の本音（like/life）に、FAMILY・大荷物を暮らし側に+1ずつ。エンタメ上の目安。
   ========================================================= */
function diagnose(ans) {
  const A = id => ans[Q_INDEX[id]];
  const tot = Object.fromEntries(ORDER.map(k => [k, 0]));
  ans.forEach((a, i) => { const w = QUESTIONS[i].opts[a].w; for (const k in w) tot[k] += w[k]; });
  const pref = ["time", "holiday"].map(id => QUESTIONS[Q_INDEX[id]].opts[A(id)].w);
  const prio = k => (pref[0][k] || 0) * 100 + (pref[1][k] || 0) * 10;
  const ranked = [...ORDER].sort((a, b) => tot[b] - tot[a] || prio(b) - prio(a) || ORDER.indexOf(a) - ORDER.indexOf(b));
  const type = ranked[0];

  const need = (A("who") === 2 || A("who") === 3) ? "FAMILY"
    : (A("luggage") >= 2 || A("use") === 3) ? "GEAR"
    : (A("use") === 1 || A("luggage") === 1) ? "CITY" : "FREE";

  const h = QUESTIONS[Q_INDEX.honne].opts[A("honne")];
  const like = h.like, life = h.life + (need === "FAMILY" ? 1 : 0) + (A("luggage") >= 2 ? 1 : 0);
  const likePct = Math.round((1 + like) / (2 + like + life) * 20) * 5;
  const rec = likePct >= 65 ? 1 : likePct <= 35 ? 2 : 3;

  const reasons = ans.map((a, i) => ({ i, o: QUESTIONS[i].opts[a] }))
    .filter(x => (x.o.w[type] || 0) > 0)
    .sort((x, y) => (y.o.w[type] || 0) - (x.o.w[type] || 0) || x.i - y.i)
    .slice(0, 3);
  return { type, need, likePct, rec, reasons };
}

  suv:      { xs: 6,  xe: 154, bt: 38, rt: 11, cr: 28, cf: 132, sr: 6,  sf: 12 },
  van:      { xs: 6,  xe: 154, bt: 40, rt: 4,  cr: 10, cf: 130, sr: 3,  sf: 24 },
  coupe:    { xs: 4,  xe: 156, bt: 44, rt: 23, cr: 40, cf: 118, sr: 20, sf: 26, wr: 12 },
  wagon:    { xs: 4,  xe: 156, bt: 42, rt: 16, cr: 14, cf: 120, sr: 4,  sf: 24 },
  truck:    { xs: 6,  xe: 154, bt: 40, rt: 11, cr: 70, cf: 134, sr: 3,  sf: 12 },
  classic:  { xs: 12, xe: 152, bt: 36, rt: 8,  cr: 24, cf: 126, sr: 2,  sf: 5 },
  round:    { xs: 22, xe: 142, bt: 40, rt: 12, cr: 28, cf: 112, sr: 14, sf: 16 },
  liftback: { xs: 10, xe: 150, bt: 41, rt: 16, cr: 24, cf: 114, sr: 18, sf: 28 },
};
let svgSeq = 0;
function carSVG(shape, color, opt = {}) {
  const { anim = true, fx = false, riders = true, label = "CARL", labelColor = "var(--white)" } = opt;
  const S = SHAPES[shape], id = "c" + (svgSeq++);
  const { xs, xe, bt, rt, cr, cf, sr, sf } = S, wr = S.wr || 13;
  const mid = (cr + cf) / 2, wt = rt + 5, wb = bt - 2;
  const rearWin = `M${cr + 5} ${wb} L${cr + sr + 5} ${wt} H${mid - 2} V${wb} Z`;
  const frontWin = `M${mid + 2} ${wt} H${cf - sf - 4} L${cf - 5} ${wb} H${mid + 2} Z`;
  const wh = wb - wt, r = Math.min(7.5, wh * 0.4), hy = wb - wh * 0.42;
  const px = (cr + sr + 5 + mid - 2) / 2, dx = (mid + 2 + cf - sf - 4) / 2 - 1;
  const ink = "var(--ink)", sw = 2.6;
  const passenger = `
    <ellipse cx="${px}" cy="${wb + r * 0.3}" rx="${r * 1.4}" ry="${r * 1.1}" fill="var(--sun)"/>
    <path d="M${px - r * 1.1} ${hy + r * 0.9} Q${px - r * 1.35} ${hy - r * 1.35} ${px} ${hy - r * 1.3} Q${px + r * 1.35} ${hy - r * 1.35} ${px + r * 1.1} ${hy + r * 0.9} Z" fill="#5a3a2a"/>
    <circle cx="${px}" cy="${hy}" r="${r}" fill="var(--skin)"/>
    <path d="M${px - r} ${hy - r * 0.1} Q${px - r} ${hy - r * 1.12} ${px} ${hy - r * 1.12} Q${px + r} ${hy - r * 1.12} ${px + r} ${hy - r * 0.1} Q${px + r * 0.1} ${hy - r * 0.65} ${px - r} ${hy - r * 0.1} Z" fill="#5a3a2a"/>
    <circle cx="${px - r * 0.2}" cy="${hy + r * 0.1}" r="${r * 0.13}" fill="${ink}"/><circle cx="${px + r * 0.45}" cy="${hy + r * 0.1}" r="${r * 0.13}" fill="${ink}"/>
    <path d="M${px - r * 0.25} ${hy + r * 0.48} Q${px + r * 0.12} ${hy + r * 0.82} ${px + r * 0.5} ${hy + r * 0.48}" stroke="${ink}" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <circle cx="${px - r * 0.45}" cy="${hy + r * 0.45}" r="${r * 0.18}" fill="#ff9d8a" opacity=".75"/>`;
  const driver = `
    <ellipse cx="${dx}" cy="${wb + r * 0.3}" rx="${r * 1.4}" ry="${r * 1.1}" fill="var(--blue-deep)"/>
    <circle cx="${dx}" cy="${hy}" r="${r}" fill="var(--skin)"/>
    <path d="M${dx - r * 1.02} ${hy - r * 0.15} Q${dx - r} ${hy - r * 1.2} ${dx} ${hy - r * 1.2} Q${dx + r} ${hy - r * 1.2} ${dx + r * 1.02} ${hy - r * 0.15} Z" fill="var(--blue-deep)"/>
    <path d="M${dx + r * 0.6} ${hy - r * 0.32} H${dx + r * 1.65} Q${dx + r * 1.75} ${hy - r * 0.05} ${dx + r * 1.4} ${hy} H${dx + r * 0.6} Z" fill="var(--blue-deep)"/>
    <circle cx="${dx + r * 0.05}" cy="${hy + r * 0.15}" r="${r * 0.13}" fill="${ink}"/><circle cx="${dx + r * 0.62}" cy="${hy + r * 0.15}" r="${r * 0.13}" fill="${ink}"/>
    <path d="M${dx - r * 0.05} ${hy + r * 0.5} Q${dx + r * 0.38} ${hy + r * 0.9} ${dx + r * 0.8} ${hy + r * 0.5}" stroke="${ink}" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M${dx + r * 1.3} ${wb + 0.5} Q${dx + r * 1.8} ${wb - r * 0.9} ${dx + r * 2.3} ${wb + 0.5}" stroke="${ink}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  const wheel = x => `<g transform="translate(${x} 66)"><g class="${anim ? "wheel" : ""}">
      <circle r="${wr}" fill="${ink}"/><circle r="${wr * 0.54}" fill="var(--white)"/>
      <path d="M0 ${-wr * 0.54} V${wr * 0.54} M${-wr * 0.54} 0 H${wr * 0.54}" stroke="var(--blue)" stroke-width="2.2"/><circle r="2" fill="${ink}"/></g></g>`;
  const lower = `M${xs} ${bt + 7} Q${xs} ${bt} ${xs + 8} ${bt} H${xe - 14} Q${xe - 1} ${bt} ${xe} ${bt + 11} V62 Q${xe} 66 ${xe - 5} 66 H${xs + 5} Q${xs} 66 ${xs} 61 Z`;
  const cabin = `M${cr} ${bt + 1} L${cr + sr} ${rt + 5} Q${cr + sr + 1} ${rt} ${cr + sr + 6} ${rt} H${cf - sf - 4} Q${cf - sf + 1} ${rt} ${cf - sf + 3} ${rt + 4} L${cf} ${bt + 1} Z`;
  const extra = shape === "truck"
      ? `<path d="M${xs + 2} ${bt + 1} V${bt - 9} H${cr - 3} V${bt + 1}" fill="${color}" stroke="${ink}" stroke-width="${sw}" stroke-linejoin="round"/>`
    : shape === "classic"
      ? `<circle cx="${xs - 3}" cy="${bt + 12}" r="10" fill="${ink}"/><circle cx="${xs - 3}" cy="${bt + 12}" r="4.5" fill="var(--white)"/>`
    : "";
  return `<svg viewBox="-26 -28 194 112" aria-hidden="true">
    <defs><clipPath id="${id}r"><path d="${rearWin}"/></clipPath><clipPath id="${id}f"><path d="${frontWin}"/></clipPath></defs>
    ${fx ? `<g class="speed" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" opacity=".7">
      <line x1="-6" y1="34" x2="-20" y2="34"/><line x1="-2" y1="46" x2="-22" y2="46"/><line x1="-6" y1="58" x2="-16" y2="58"/></g>
      <text class="note" x="${px - 6}" y="${rt - 8}" font-size="14" font-weight="700" fill="var(--blue)">♪</text>
      <text class="note n2" x="${px + 12}" y="${rt - 16}" font-size="11" font-weight="700" fill="var(--blue)">♫</text>` : ""}
    <ellipse cx="80" cy="79" rx="72" ry="4" fill="${ink}" opacity=".12"/>
    <g class="${anim ? "bob" : ""}">
      ${extra}
      <path d="${cabin}" fill="${color}" stroke="${ink}" stroke-width="${sw}" stroke-linejoin="round"/>
      <path d="${lower}" fill="${color}" stroke="${ink}" stroke-width="${sw}" stroke-linejoin="round"/>
      <path d="${rearWin}" fill="var(--sky)"/><path d="${frontWin}" fill="var(--sky)"/>
      ${riders ? `<g clip-path="url(#${id}r)">${passenger}</g><g clip-path="url(#${id}f)">${driver}</g>` : ""}
      <path d="${rearWin} ${frontWin}" fill="none" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/>
      <line x1="${mid}" y1="${bt + 2}" x2="${mid}" y2="62" stroke="${ink}" stroke-width="1.6"/>
      <rect x="${mid + 6}" y="${bt + 6}" width="9" height="2.6" rx="1.3" fill="${ink}"/>
      ${label ? `<text x="${cr + 8}" y="${bt + 18}" font-family="Archivo, Arial, sans-serif" font-style="italic" font-weight="900" font-size="9.5" fill="${labelColor}">${label}</text>` : ""}
      <circle cx="${xe - 5}" cy="${bt + 9}" r="4" fill="var(--sun)" stroke="${ink}" stroke-width="2"/>
      <rect x="${xs - 1}" y="${bt + 6}" width="4.5" height="7.5" rx="1.5" fill="#ff5a4e" stroke="${ink}" stroke-width="1.6"/>
    </g>
    ${wheel(xs + 30)}${wheel(xe - 32)}
  </svg>`;
}

/* =========================================================
   コレクションカードの絵（明るいメイン色＋アクセント1色・背景モチーフは1〜2個）
   ========================================================= */
/* main＝背景、acc＝アクセント、deep＝文字・指標の色、num＝番号の色、body/lower＝車体色（なければ白） */
const LOOK = {
  wander:  { main: "#1fc2bb", acc: "#efff4f", deep: "#0a6f6a", num: "#ffffff" },
  family:  { main: "#ffa53d", acc: "#fff1d6", deep: "#b35a00", num: "#ffffff" },
  style:   { main: "#ff5c8a", acc: "#efff4f", deep: "#c8205a", num: "#ffffff" },
  gear:    { main: "#bde63c", acc: "#2337a6", deep: "#2337a6", num: "#2337a6" },
  vintage: { main: "#ff8f86", acc: "#ff9a3c", cream: "#fff1d6", tint: "#ffb8ad", deep: "#c9433b", num: "#ffffff", body: "#fff1d6" },
  city:    { main: "#f0ff5a", acc: "#ff5c8a", deep: "#d2316a", num: "#ff5c8a", lower: "#ff5c8a" },
  smart:   { main: "#a6e8cf", acc: "#2337a6", deep: "#2337a6", num: "#2337a6" },
  cruise:  { main: "#3b6cf2", acc: "#efff4f", deep: "#2f55d4", num: "#ffffff" },
};

/* クルマ：既存アイコンの線と形を引き継ぎ、タイプごとに装備を足す */
let carSeq = 0;
function cardCar(shape, P, opt = {}) {
  const { riders = true, kit = "" } = opt;
  const S = SHAPES[shape], id = "n" + (carSeq++);
  const { xs, xe, bt, rt, cr, cf, sr, sf } = S, wr = S.wr || 13;
  const mid = (cr + cf) / 2, wt = rt + 5, wb = bt - 2;
  const rearWin = `M${cr + 5} ${wb} L${cr + sr + 5} ${wt} H${mid - 2} V${wb} Z`;
  const frontWin = `M${mid + 2} ${wt} H${cf - sf - 4} L${cf - 5} ${wb} H${mid + 2} Z`;
  const I = "#1d1d1f", W = "#ffffff", sw = 2.4;
  const body = P.body || W, lowerFill = P.lower || body;
  // 乗っている人は既存 carSVG から流用（窓だけ切り出す）
  const people = riders ? carSVG(shape, W, { anim: false, label: "" }).match(/<g clip-path="url\(#c\d+r\)">[\s\S]*?<\/g><g clip-path="url\(#c\d+f\)">[\s\S]*?<\/g>/)?.[0]
      .replace(/url\(#c(\d+)r\)/, `url(#${id}r)`).replace(/url\(#c(\d+)f\)/, `url(#${id}f)`) : "";
  const wheel = x => `<g transform="translate(${x} 66)"><circle r="${wr}" fill="${I}"/>
      ${kit === "classic" ? `<circle r="${wr * 0.74}" fill="${W}"/><circle r="${wr * 0.56}" fill="${I}"/>` : ""}
      <circle r="${wr * 0.46}" fill="${kit === "classic" ? "#d8d8de" : W}"/>
      <path d="M0 ${-wr * 0.46} V${wr * 0.46} M${-wr * 0.46} 0 H${wr * 0.46}" stroke="${P.deep}" stroke-width="2"/><circle r="1.8" fill="${I}"/></g>`;
  const lower = `M${xs} ${bt + 7} Q${xs} ${bt} ${xs + 8} ${bt} H${xe - 14} Q${xe - 1} ${bt} ${xe} ${bt + 11} V62 Q${xe} 66 ${xe - 5} 66 H${xs + 5} Q${xs} 66 ${xs} 61 Z`;
  const cabin = `M${cr} ${bt + 1} L${cr + sr} ${rt + 5} Q${cr + sr + 1} ${rt} ${cr + sr + 6} ${rt} H${cf - sf - 4} Q${cf - sf + 1} ${rt} ${cf - sf + 3} ${rt + 4} L${cf} ${bt + 1} Z`;
  let back = "", front = "";
  if (kit === "rails") {          // 01：背面スペアタイヤ＋空のルーフレール（どこへでも寄り道できる身軽さ）
    back = `<circle cx="${xs - 3}" cy="${bt + 12}" r="10" fill="${I}"/><circle cx="${xs - 3}" cy="${bt + 12}" r="4.6" fill="${P.acc}"/>
      <path d="M${cr + sr + 10} ${rt} V${rt - 5} M${cf - sf - 8} ${rt} V${rt - 5} M${cr + sr + 4} ${rt - 5} H${cf - sf - 2}" stroke="${I}" stroke-width="2.4" stroke-linecap="round"/>`;
  } else if (kit === "sport") {   // 03：2本のレーシングストライプ＋小さなリアスポイラー
    back = `<path d="M${xs + 4} ${bt - 2} V${bt - 8} M${xs + 1} ${bt - 8} H${xs + 18}" stroke="${I}" stroke-width="2.6" stroke-linecap="round"/>`;
    front = `<path d="M${xs + 10} ${bt + 9} H${xe - 10} M${xs + 10} ${bt + 14} H${xe - 10}" stroke="${P.acc}" stroke-width="2.6"/>`;
  } else if (kit === "family") {  // 02：スライドドアのレール
    front = `<line x1="${cr + 6}" y1="${bt + 8}" x2="${(cr + cf) / 2 - 4}" y2="${bt + 8}" stroke="${I}" stroke-width="1.5" stroke-linecap="round"/>`;
  } else if (kit === "haul") {    // 04：荷台のクーラーボックスと寝袋＋キャブ上のルーフボックス
    back = `<path d="M${xs + 2} ${bt + 1} V${bt - 9} H${cr - 3} V${bt + 1}" fill="${body}" stroke="${I}" stroke-width="${sw}" stroke-linejoin="round"/>
      <rect x="${xs + 6}" y="${bt - 25}" width="26" height="17" rx="3" fill="${P.acc}" stroke="${I}" stroke-width="2"/><rect x="${xs + 13}" y="${bt - 29}" width="12" height="5" rx="2" fill="none" stroke="${I}" stroke-width="2"/>
      <line x1="${xs + 6}" y1="${bt - 19}" x2="${xs + 32}" y2="${bt - 19}" stroke="${W}" stroke-width="1.6"/>
      <rect x="${xs + 35}" y="${bt - 21}" width="24" height="13" rx="6.5" fill="${W}" stroke="${I}" stroke-width="2"/><path d="M${xs + 42} ${bt - 21} V${bt - 8} M${xs + 50} ${bt - 21} V${bt - 8}" stroke="${P.acc}" stroke-width="2"/>
      <path d="M${cr + sr + 9} ${rt} V${rt - 4} M${cf - sf - 7} ${rt} V${rt - 4}" stroke="${I}" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M${cr + sr + 2} ${rt - 4} Q${cr + sr + 2} ${rt - 14} ${cr + sr + 14} ${rt - 14} H${cf - sf - 4} Q${cf - sf + 4} ${rt - 14} ${cf - sf + 4} ${rt - 4} Z" fill="${P.acc}" stroke="${I}" stroke-width="2" stroke-linejoin="round"/>`;
  } else if (kit === "classic") { // 05：丸目・メッキバンパー・ホワイトリボン・2トーン
    back = `<circle cx="${xs - 3}" cy="${bt + 12}" r="10" fill="${I}"/><circle cx="${xs - 3}" cy="${bt + 12}" r="5" fill="${W}"/>`;
    front = `<rect x="${xs - 5}" y="${bt + 19}" width="10" height="4.5" rx="2.2" fill="#d8d8de" stroke="${I}" stroke-width="1.6"/>
      <rect x="${xe - 6}" y="${bt + 19}" width="11" height="4.5" rx="2.2" fill="#d8d8de" stroke="${I}" stroke-width="1.6"/>
      <line x1="${xs + 8}" y1="${bt + 4}" x2="${xe - 12}" y2="${bt + 4}" stroke="${P.acc}" stroke-width="2.6"/>`;
  }
  return `<svg viewBox="-26 -28 194 112" aria-hidden="true">
    <defs><clipPath id="${id}r"><path d="${rearWin}"/></clipPath><clipPath id="${id}f"><path d="${frontWin}"/></clipPath></defs>
    <ellipse cx="80" cy="80" rx="74" ry="3.5" fill="${I}" opacity=".18"/>
    ${back}
    <path d="${cabin}" fill="${body}" stroke="${I}" stroke-width="${sw}" stroke-linejoin="round"/>
    <path d="${lower}" fill="${lowerFill}" stroke="${I}" stroke-width="${sw}" stroke-linejoin="round"/>
    <path d="${rearWin}" fill="#e3ecff"/><path d="${frontWin}" fill="#e3ecff"/>
    ${people}
    <path d="${rearWin} ${frontWin}" fill="none" stroke="${I}" stroke-width="2" stroke-linejoin="round"/>
    <line x1="${mid}" y1="${bt + 2}" x2="${mid}" y2="62" stroke="${I}" stroke-width="1.5"/>
    <rect x="${mid + 6}" y="${bt + 6}" width="9" height="2.6" rx="1.3" fill="${I}"/>
    ${front}
    <circle cx="${xe - 5}" cy="${bt + 9}" r="${kit === "classic" ? 5 : 4}" fill="${kit === "classic" ? "#fff6c9" : P.acc}" stroke="${I}" stroke-width="2"/>
    <rect x="${xs - 1}" y="${bt + 6}" width="4.5" height="7.5" rx="1.5" fill="#ff5a4e" stroke="${I}" stroke-width="1.5"/>
    ${wheel(xs + 30)}${wheel(xe - 32)}
  </svg>`;
}

/* 背景：モチーフは1〜2個まで。余白を残して、クルマと番号を主役に */
function cardScene(k, P) {
  const W = "#ffffff", I = "#1d1d1f";
  const road = `<rect x="0" y="262" width="320" height="58" fill="${I}"/>
    <g fill="${W}">${Array.from({ length: 9 }, (_, i) => `<rect x="${i * 40 - 6}" y="289" width="22" height="4" rx="2"/>`).join("")}</g>`;
  const g = {
    // 太陽＋小さな「CAFE」の道しるべ
    wander: `<circle cx="226" cy="150" r="48" fill="${P.acc}"/>
      <rect x="0" y="218" width="320" height="44" fill="#17b2ab"/>
      <rect x="293" y="166" width="4" height="96" fill="${W}"/>
      <path d="M266 168 H306 L314 176 L306 184 H266 Z" fill="${W}"/>
      <text x="288" y="180" text-anchor="middle" font-size="9.5" font-weight="700" fill="${I}" font-family="Outfit, Arial, sans-serif" letter-spacing=".5">CAFE</text>`,
    // 家ひとつ＋小さな雲（帰る場所がある）
    family: `<path d="M226 262 V184 L264 152 L302 184 V262 Z" fill="${P.acc}"/>
      <rect x="252" y="190" width="24" height="20" rx="3" fill="${P.main}" opacity=".55"/>
      <g fill="${W}"><circle cx="150" cy="128" r="11"/><circle cx="164" cy="122" r="14"/><circle cx="180" cy="129" r="10"/><rect x="150" y="128" width="30" height="11"/></g>`,
    // 峠の稜線（淡いピンク）＋スピードライン
    style: `<path d="M-10 262 L70 214 L130 240 L214 184 L330 252 V262 Z" fill="#ff86a8"/>
      <g fill="${P.acc}"><rect x="-8" y="190" width="56" height="6" rx="3"/><rect x="-8" y="206" width="40" height="6" rx="3"/><rect x="-8" y="222" width="50" height="6" rx="3"/></g>`,
    // 小さな山ひとつ＋白い太陽
    gear: `<path d="M190 262 L250 176 L310 262 Z" fill="${P.acc}"/>
      <path d="M236 196 L250 176 L264 196 L257 192 L250 199 L243 192 Z" fill="${W}"/>
      <circle cx="168" cy="140" r="11" fill="${W}"/>`,
    // 古いガレージの入口（アーチ）＋オレンジの太陽
    vintage: `<path d="M150 262 V172 A64 64 0 0 1 278 172 V262 Z" fill="${P.tint}"/>
      <circle cx="132" cy="146" r="13" fill="${P.acc}"/>`,
    // 白いビル＋ピンクの日よけの小さな店
    city: `<rect x="222" y="138" width="38" height="124" fill="${W}"/>
      <g fill="${P.acc}"><rect x="232" y="152" width="7" height="9" rx="1.5"/><rect x="244" y="152" width="7" height="9" rx="1.5"/><rect x="232" y="168" width="7" height="9" rx="1.5"/></g>
      <rect x="264" y="186" width="44" height="76" fill="${W}" opacity=".75"/>
      <g>${Array.from({ length: 6 }, (_, i) => `<rect x="${260 + i * 8.67}" y="178" width="8.67" height="14" fill="${i % 2 ? W : P.acc}"/>`).join("")}</g>`,
    // 比べて選んだチェックリスト
    smart: `<rect x="214" y="104" width="70" height="84" rx="12" fill="${W}"/>
      <g stroke="${P.acc}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M226 124 l4 4 l8 -9"/><path d="M226 146 l4 4 l8 -9"/></g>
      <g fill="${P.main}"><rect x="246" y="121" width="28" height="5" rx="2.5"/><rect x="246" y="143" width="22" height="5" rx="2.5"/><rect x="246" y="165" width="26" height="5" rx="2.5"/></g>
      <rect x="226" y="161" width="12" height="12" rx="3" fill="none" stroke="${P.main}" stroke-width="2.4"/>`,
    // 三日月と星（夜のロングドライブ）
    cruise: `<path d="M244 102 a46 46 0 1 0 40 66 a36 36 0 1 1 -40 -66 Z" fill="${P.acc}"/>
      <g fill="${W}"><circle cx="172" cy="122" r="2.6"/><circle cx="296" cy="96" r="2"/><circle cx="196" cy="168" r="1.8"/><circle cx="300" cy="196" r="2.4"/></g>`,
  }[k];
  return g + road;
}

const KIT = { wander: "rails", family: "family", style: "sport", gear: "haul", vintage: "classic" };
/* カードの絵（320×320）。vb で上側を切り落とすと保存画像用の横長になる */
function cardArt(k, riders, vb = "0 0 320 320") {
  const T = TYPES[k], L = LOOK[k];
  return `<svg viewBox="${vb}" aria-hidden="true">${cardScene(k, L)}
    <svg x="16" y="134" width="272" height="157" viewBox="-26 -28 194 112" overflow="visible">${cardCar(T.shape, L, { riders, kit: KIT[k] }).replace(/^<svg[^>]*>|<\/svg>$/g, "")}</svg></svg>`;
}
const lookVars = k => { const L = LOOK[k]; return `--main:${L.main};--acc:${L.acc};--deep:${L.deep};--num:${L.num}`; };

/* =========================================================
   計測（GA4が入っていれば送信。個人情報・回答内容は送らない）
   ========================================================= */
/* イベント名：car_match_view（表示）/ car_match_start（開始）/ car_match_answer（各問）/ car_match_complete（完了・type別）
   car_match_save_click / car_match_copy_click / car_match_share_click / car_match_consult_click（いずれも「押した数」で、保存・投稿の完了ではない）
   car_match_retry（もう一度） */
function track(name, params = {}) {
  try {
    if (typeof window.gtag === "function") window.gtag("event", name, params);
    else if (Array.isArray(window.dataLayer)) window.dataLayer.push({ event: name, ...params });
  } catch (e) {}
}

/* =========================================================
   画面
   ========================================================= */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const carName = ([mk, md]) => `${mk} ${md}`;
const plainName = n => n.replace("|", "");
const nameHTML = n => esc(n).replace("|", "<wbr>");
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const BRAND = cls => `<img class="brand ${cls || ""}" src="${LOGO}" alt="CARL PASSER">`;
const N = QUESTIONS.length;
let viewed = false;
let state = { screen: "start", idx: 0, answers: [] };
let locked = false;

function render() { ({ start: renderStart, quiz: renderQuiz, result: renderResult })[state.screen](); window.scrollTo({ top: 0 }); }
function reset() { state = { screen: "start", idx: 0, answers: [] }; render(); }

function miniCard(k, opts = {}) {
  const T = TYPES[k];
  return `<div class="mini nc${opts.you ? " you" : ""}${opts.hidden ? " hidden" : ""}" style="${lookVars(k)}">
    <div class="na">${cardArt(k, !opts.hidden)}<span class="num">${pad(T.no)}</span><span class="wm">CAR MATCH</span></div>
    <div class="nm"><span class="t"><span>TYPE ${pad(T.no)}</span><span>${pad(T.no)} / 08</span></span><b>${opts.hidden ? "？？？" : nameHTML(T.name)}</b></div>
  </div>`;
}

const riderLeft = p => `calc((100% - 146px) * ${p})`;

function renderQuiz() {
  const i = state.idx, Q = QUESTIONS[i];
  const [catEn, catJ] = PART_LABEL[Q.part];
  const checkpoint = i > 0 && QUESTIONS[i - 1].part !== Q.part;
  app.innerHTML = `
  <div class="wrap">
    <div class="top"><span class="logo sm">CAR <span>MATCH</span></span><span class="qcount"><b>${pad(i + 1)}</b>/ ${N}</span></div>
    <div class="segs" aria-hidden="true">${QUESTIONS.map((_, k) => `<i class="${k < i ? "on" : ""}"></i>`).join("")}</div>
    <div class="stage" id="stage" role="progressbar" aria-label="進み具合" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${i}">
      <div class="pole"></div><div class="road"><div class="flag"></div></div>
      <div class="rider" id="rider" style="left:${riderLeft(Math.max(0, i - 1) / N)}">${carSVG("suv", "var(--blue)", { fx: true })}</div>
    </div>
    <section class="fade qhead">
      ${checkpoint ? `<div class="checkpoint"><i class="f"></i><div><b>CHECKPOINT</b><span>好きなものの話はここまで。<wbr>ここからは、暮らしの話。</span></div></div>` : ""}
      <span class="cat"><span class="lat">${catEn}</span>${catJ}</span>
      <h2 class="qtext">${esc(Q.q)}</h2>
      <div class="opts">${Q.opts.map((o, k) => `
        <button class="opt${state.answers[i] === k ? " picked" : ""}" id="opt-${k}" data-k="${k}">
          <span class="k">${k + 1}</span><span class="t">${esc(o.t)}<span class="s">${esc(o.s)}</span></span>
        </button>`).join("")}</div>
    </section>
    <div class="nav">
      <button class="link" id="back" ${i === 0 ? "disabled" : ""}>← ひとつ戻る</button>
      <button class="link" id="quit">はじめから</button>
    </div>
  </div>
  <div class="goal-ov" id="goalOv" hidden role="status" aria-live="polite">
    <i class="checker" aria-hidden="true"></i>
    <p class="goal-big">GOAL!</p>
    <p class="goal-next">あなたのタイプは…</p>
    <button class="link skip" id="skipGoal">スキップ ›</button>
  </div>`;
  requestAnimationFrame(() => { const r = document.getElementById("rider"); if (r) r.style.left = riderLeft(i / N); });
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.k));
  document.getElementById("back").onclick = () => { if (state.idx > 0) { state.idx--; render(); } };
  document.getElementById("quit").onclick = reset;
  locked = false;
}

function pick(k) {
  if (locked) return;
  locked = true;
  const i = state.idx, last = i + 1 === N;
  state.answers[i] = k;
  state.answers = state.answers.slice(0, i + 1);
  track("car_match_answer", { question: i + 1 });
  app.querySelectorAll(".opt").forEach(b => b.classList.toggle("picked", +b.dataset.k === k));
  const segs = app.querySelectorAll(".segs i"); if (segs[i]) segs[i].classList.add("on");
  const r = document.getElementById("rider");
  if (last) { goalSequence(r); return; }
  if (r) { r.style.left = riderLeft((i + 1) / N); r.classList.remove("hop"); void r.offsetWidth; r.classList.add("hop"); }
  setTimeout(() => { state.idx++; render(); }, reduce() ? 80 : 400);
}

/* 10問目のあと：クルマが加速してフラッグを通過 → GOAL! → 「あなたのタイプは…」→ 結果（約1.9秒、タップでスキップ） */
function goalSequence(r) {
  const ov = document.getElementById("goalOv"), rm = reduce(), timers = [];
  const finish = () => {
    timers.forEach(clearTimeout);
    if (state.screen !== "quiz") return;
    state.screen = "result"; render();
  };
  if (r && !rm) { r.style.transition = "left .6s cubic-bezier(.6,0,.9,.5)"; r.style.left = "calc(100% + 40px)"; }
  ov.onclick = finish;
  timers.push(setTimeout(() => { ov.hidden = false; }, rm ? 0 : 560));
  timers.push(setTimeout(() => ov.classList.add("next"), rm ? 0 : 1080));
  timers.push(setTimeout(finish, rm ? 900 : 1900));
}

document.addEventListener("keydown", e => {
  if (state.screen !== "quiz") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) pick(n - 1);
});

/* =========================================================
   ストーリーズ用の縦長画像（1080×1920）をcanvasで描く
   ========================================================= */
const COL = { paper: "#fdfcf9", white: "#ffffff", ink: "#1d1d1f", "ink-2": "#3c3b39", muted: "#78756e", line: "#e3dfd6",
  blue: "#2451b5", "blue-deep": "#18357d", sky: "#e4ebf8", sun: "#ffc94a", skin: "#ffd7b5", bg: "#f4f2ed" };
function svgImage(svg, w, h, T) {
  const vars = { ...COL, tc: T.color, tcd: T.dark };
  const src = svg.replace(/var\(--([a-z0-9-]+)\)/g, (m, n) => vars[n] || "#000")
    .replace("<svg ", `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" `);
  return loadImg("data:image/svg+xml;charset=utf-8," + encodeURIComponent(src));
}
function loadImg(src) {
  return new Promise((ok, ng) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ng; im.src = src; });
}
function rr(x, X, Y, W, H, R) { x.beginPath(); x.roundRect ? x.roundRect(X, Y, W, H, R) : x.rect(X, Y, W, H); }
function wrapLines(x, text, maxW) {
  const out = []; let line = "";
  for (const ch of text) { if (x.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; } else line += ch; }
  if (line) out.push(line);
  return out;
}
async function makeStory(k) {
  const T = TYPES[k], W = 1080, H = 1920;
  try {
    await Promise.all([
      document.fonts.load('italic 900 60px "Archivo"'), document.fonts.load('700 30px "Outfit"'),
      document.fonts.load('800 70px "Noto Sans JP"', plainName(T.name) + "あなたは何タイプ？"),
      document.fonts.load('500 36px "Noto Sans JP"', T.punch + STAT_LABELS.join("")),
    ]);
  } catch (e) {}
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = COL.bg; x.fillRect(0, 0, W, H);

  const logo = await loadImg(LOGO);
  x.drawImage(logo, 90, 110, 220, 220 * logo.height / logo.width);
  x.font = 'italic 900 58px "Archivo", sans-serif'; x.textAlign = "right"; x.textBaseline = "alphabetic";
  x.fillStyle = COL.blue; x.fillText("MATCH", 990, 206);
  const mw = x.measureText("MATCH").width;
  x.fillStyle = COL.ink; x.fillText("CAR ", 990 - mw, 206);

  // card（画面のカードと同じ構成：絵・番号・ロゴ／タイプ名・ひとこと・指標／フッター）
  const L = LOOK[k], cx = 90, cy = 270, cw = 900, ch = 1420;
  x.save(); x.shadowColor = "rgba(29,29,31,.22)"; x.shadowBlur = 60; x.shadowOffsetY = 26;
  rr(x, cx, cy, cw, ch, 48); x.fillStyle = COL.white; x.fill(); x.restore();
  x.save(); rr(x, cx, cy, cw, ch, 48); x.clip();
  const ay = cy, ah = cw * 280 / 320;
  x.fillStyle = L.main; x.fillRect(cx, ay, cw, ah);
  const art = await svgImage(cardArt(k, true, "0 40 320 280"), cw, ah, T);
  x.drawImage(art, cx, ay);
  x.fillStyle = L.num; x.textBaseline = "top"; x.textAlign = "left";
  x.font = 'italic 900 300px "Archivo", sans-serif';
  if ("letterSpacing" in x) x.letterSpacing = "-14px";
  x.fillText(pad(T.no), cx + 44, ay + 4);
  if ("letterSpacing" in x) x.letterSpacing = "0px";
  x.font = 'italic 900 32px "Archivo", sans-serif'; x.textAlign = "right"; x.fillText("CAR MATCH", cx + cw - 48, ay + 48);
  x.textBaseline = "alphabetic"; x.textAlign = "left";
  // body
  let y = ay + ah + 78;
  x.fillStyle = L.deep; x.font = '700 28px "Outfit", sans-serif';
  if ("letterSpacing" in x) x.letterSpacing = "5px";
  x.fillText(`TYPE ${pad(T.no)} — ${T.en}`, cx + 48, y);
  if ("letterSpacing" in x) x.letterSpacing = "0px";
  x.fillStyle = COL.ink; x.font = '800 68px "Noto Sans JP", sans-serif';
  const full = plainName(T.name);
  const nameLines = x.measureText(full).width <= cw - 96 ? [full] : T.name.split("|");
  y += 18;
  for (const l of nameLines) { y += 86; x.fillText(l, cx + 48, y); }
  x.fillStyle = COL["ink-2"]; x.font = '500 36px "Noto Sans JP", sans-serif';
  y += 18;
  for (const l of wrapLines(x, T.punch, cw - 96)) { y += 54; x.fillText(l, cx + 48, y); }
  // stats
  y += 36;
  STAT_LABELS.forEach((l, j) => {
    const sx = cx + 48 + (j % 2) * 420, sy = y + Math.floor(j / 2) * 56 + 30;
    x.fillStyle = COL["ink-2"]; x.font = '500 28px "Noto Sans JP", sans-serif'; x.fillText(l, sx, sy);
    for (let p = 0; p < 5; p++) { x.beginPath(); x.arc(sx + 190 + p * 34, sy - 10, 11, 0, Math.PI * 2); x.fillStyle = p < T.stats[j] ? L.deep : "#ebe8e1"; x.fill(); }
  });
  // foot
  const fy = cy + ch - 110;
  x.fillStyle = COL.line; x.fillRect(cx, fy, cw, 2);
  x.drawImage(logo, cx + 48, fy + 34, 110, 110 * logo.height / logo.width);
  x.fillStyle = COL.muted; x.font = '700 22px "Outfit", sans-serif'; x.textAlign = "right";
  if ("letterSpacing" in x) x.letterSpacing = "4px";
  x.fillText("10 PEOPLE 10 CARS", cx + cw - 48, fy + 66);
  if ("letterSpacing" in x) x.letterSpacing = "0px";
  x.restore();

  // bottom
  x.textAlign = "center"; x.fillStyle = COL.ink; x.font = '800 50px "Noto Sans JP", sans-serif';
  x.fillText("あなたは何タイプ？", W / 2, 1772);
  x.fillStyle = COL.muted; x.font = '600 30px "Outfit", sans-serif';
  x.fillText("CAR MATCH  |  carlpasser.jp", W / 2, 1828);
  x.fillStyle = COL.blue; x.font = '600 26px "Outfit", sans-serif';
  x.fillText("#CARMATCH  #10PEOPLE10CARS", W / 2, 1870);

  return await new Promise((ok, ng) => c.toBlob(b => b ? ok(URL.createObjectURL(b)) : ng(new Error("blob")), "image/png"));
}

window.claude?.hot?.snapshot?.(() => state);
function start(data) {
  if (data && data.screen) state = data;
  if (!viewed) { viewed = true; track("car_match_view"); }
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
